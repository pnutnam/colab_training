[project]
name = "colab-training"
version = "0.1.0"
description = "Agentic off-machine LLM training: Google Colab GPUs + Hugging Face Hub"
requires-python = ">=3.12"
dependencies = [
    # Local orchestration only — heavy training deps live on the Colab VM
    # (see training/requirements-colab.txt).
    "huggingface_hub>=1.0",
    "datasets>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
